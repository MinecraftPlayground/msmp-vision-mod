name: 'Visual Test'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'enforce = fail when a threshold is exceeded, report-only = only report'
        type: choice
        default: 'enforce'
        options: 
          - 'enforce'
          - 'report-only'

      cases:
        description: 'Glob for the case names to run (ex. "forest*")'
        type: string
        default: '*'

  pull_request:
    branches:
      - main

  push:
    paths:
      - 'src/**'
      - 'tests/visual/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/visual_test.yml'

concurrency:
  group: 'visual-test-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-test:
    name: 'Visual Test'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6

      - name: 'Setup JDK'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6

      - name: 'Build Mod'
        run: |
          ./gradlew build
          ls -la build/libs/

      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tests/visual/requirements.txt'

      - name: 'Install Python Dependencies'
        run: pip install -r tests/visual/requirements.txt

      # Downloads (Fabric launcher, Fabric API), the Minecraft server files and the client assets are reused between
      # runs. The world is never cached. Saved separately so the cache is also written when the test fails.
      - name: 'Restore Server Cache'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tests/visual/.cache
            tests/visual/.server/libraries
            tests/visual/.server/versions
            tests/visual/.server/.fabric
            tests/visual/.server/config/msmp/vision/client_assets
          key: visual-test-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            visual-test-${{ runner.os }}-

      - name: 'Run Visual Test'
        env:
          MODE: ${{ inputs.mode || 'enforce' }}
          CASES: ${{ inputs.cases || '*' }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          echo "Using $JAR"
          python tests/visual/main.py --mod-jar "$JAR" --mode "$MODE" --cases "$CASES"

      - name: 'Save Server Cache'
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tests/visual/.cache
            tests/visual/.server/libraries
            tests/visual/.server/versions
            tests/visual/.server/.fabric
            tests/visual/.server/config/msmp/vision/client_assets
          key: visual-test-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: 'Upload Results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 'visual-test-results'
          path: tests/visual/results/
          if-no-files-found: warn
